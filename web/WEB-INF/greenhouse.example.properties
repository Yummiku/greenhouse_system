# 复制本文件为greenhouse.local.properties，使用UTF-8保存。
# 此示例可以共享；local文件不要发送给组员或提交Git。
greenhouse.db.host=localhost
greenhouse.db.port=3366
greenhouse.db.user=root
# 可选：验收副本连接独立库时填写，未配置时沿用源码中的库名。
# greenhouse.db.name=greenhouse_system_test
# 填写自己的MySQL密码；此处不是系统登录密码。
greenhouse.db.password=

# 可选：接入微信小程序时填写自己的配置；PC开发可以暂不填写。
# week08.apiKey=至少16个字符的随机访问码
# week08.wxAppId=自己的小程序AppID
# week08.wxAppSecret=自己的小程序AppSecret

# 可选：环境采集上传凭据（第12周 唐昕煜 环境采样模块）。
# 不填时 /api/environment/ingest 直接返回503，页面与查询接口不受影响。
# 生成方式示例：随机32位以上字符串，只写在local文件里，不入库、不提交。
# greenhouse.environment.collectorKey=请替换为至少32位的随机字符串
